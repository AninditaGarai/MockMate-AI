stages:
  - lint
  - test
  - build
  - deploy

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/backend/.cache/pip"

cache:
  paths:
    - backend/.cache/pip
    - backend/venv/
    - frontend/node_modules/

before_script:
  - echo "Starting pipeline..."

# Backend Jobs
backend_lint:
  stage: lint
  image: python:3.11
  script:
    - cd backend
    - python -m pip install flake8 black
    - flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
    - black . --check
  only:
    - merge_requests

backend_test:
  stage: test
  image: python:3.11
  services:
    - postgres:15
  variables:
    POSTGRES_DB: mockmate_test
    POSTGRES_USER: test
    POSTGRES_PASSWORD: test
  script:
    - cd backend
    - python -m venv venv
    - source venv/bin/activate
    - pip install -r requirements.txt pytest pytest-asyncio
    - pytest
  only:
    - merge_requests

# Frontend Jobs
frontend_lint:
  stage: lint
  image: node:18
  script:
    - cd frontend
    - npm ci
    - npm run lint
  only:
    - merge_requests

frontend_test:
  stage: test
  image: node:18
  script:
    - cd frontend
    - npm ci
    - npm run test
  only:
    - merge_requests

frontend_build:
  stage: build
  image: node:18
  script:
    - cd frontend
    - npm ci
    - npm run build
  artifacts:
    paths:
      - frontend/dist/
  only:
    - main

backend_build:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  script:
    - docker build -t $CI_REGISTRY_IMAGE:backend-$CI_COMMIT_SHA backend/
    - docker tag $CI_REGISTRY_IMAGE:backend-$CI_COMMIT_SHA $CI_REGISTRY_IMAGE:backend-latest
    - docker push $CI_REGISTRY_IMAGE:backend-$CI_COMMIT_SHA
    - docker push $CI_REGISTRY_IMAGE:backend-latest
  only:
    - main

deploy_production:
  stage: deploy
  image: alpine:latest
  script:
    - apk add --no-cache curl
    - curl -X POST $DEPLOY_WEBHOOK_URL
  only:
    - main
  when: manual
